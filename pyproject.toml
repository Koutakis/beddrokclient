[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "BeddrokClient"
version = "3.0.1"
description = "Client for interacting with Beddrok"
readme = "README.md"
authors = [{ name = "Alexander Koutakis" }]
license = { file = "LICENSE" }
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.32.3,<3.0.0",
]

[project.optional-dependencies]
arrow = ["pyarrow>=17.0"]
dev = ["pytest", "ruff", "pyright", "pyarrow>=17.0"]

[project.urls]
Homepage = "https://github.com/Koutakis/beddrokclient"
Issues = "https://github.com/Koutakis/beddrokclient/issues"

[tool.setuptools]
packages = ["beddrokclient"]
